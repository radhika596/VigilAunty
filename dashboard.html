<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vigilaunty Dashboard</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#1a1d21;--muted:#6b7280;--line:#e5e7eb;--ok:#15803d;--bad:#b91c1c;--badbg:#fee2e2;--okbg:#dcfce7}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#181b21;--text:#e8eaed;--muted:#9aa0a6;--line:#2a2f37;--ok:#4ade80;--bad:#f87171;--badbg:#3b1717;--okbg:#14301f}}
*{box-sizing:border-box}body{margin:0;font:15px system-ui,sans-serif;background:var(--bg);color:var(--text);padding:24px}
h1{font-size:20px;margin:0 0 4px}.sub{color:var(--muted);margin-bottom:20px}
.top{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 16px;min-width:150px}
.stat b{display:block;font-size:22px}.stat span{color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-bottom:24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
.card h3{margin:0 0 8px;display:flex;justify-content:space-between;align-items:center;font-size:16px}
.pill{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--okbg);color:var(--ok)}
.pill.bad{background:var(--badbg);color:var(--bad)}
.row{display:flex;justify-content:space-between;padding:3px 0;color:var(--muted)}.row b{color:var(--text)}
.row b.bad{color:var(--bad)}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-weight:500;font-size:13px}
h2{font-size:16px;margin:0 0 10px}.empty{color:var(--muted);padding:14px}
</style></head><body>
<h1>Vigilaunty</h1><div class="sub" id="sub">Loading…</div>
<div class="top" id="top"></div>
<div class="grid" id="grid"></div>
<h2>Incidents</h2><div id="inc"></div>
<script>
const f=(v,s="")=>v==null?"–":v+s;
async function load(){
  try{
    const [s,i]=await Promise.all([fetch("/reports/summary").then(r=>r.json()),fetch("/incidents").then(r=>r.json())]);
    const total=s.services.reduce((a,x)=>a+x.request_count,0);
    document.getElementById("sub").textContent=`Last ${s.window_minutes} min · updated ${new Date().toLocaleTimeString()}`;
    document.getElementById("top").innerHTML=
      `<div class="stat"><b>${s.services.length}</b><span>Services</span></div>
       <div class="stat"><b>${total.toLocaleString()}</b><span>Requests</span></div>
       <div class="stat"><b style="color:${s.total_open_incidents?'var(--bad)':'var(--ok)'}">${s.total_open_incidents}</b><span>Open incidents</span></div>`;
    document.getElementById("grid").innerHTML=s.services.map(x=>{
      const bad=x.open_incidents>0;
      return `<div class="card"><h3>${x.service}<span class="pill ${bad?'bad':''}">${bad?'Incident':'Healthy'}</span></h3>
      <div class="row">Requests<b>${x.request_count.toLocaleString()}</b></div>
      <div class="row">Error rate<b class="${bad?'bad':''}">${f(x.error_rate,'%')}</b></div>
      <div class="row">p50 latency<b>${f(x.p50_latency_ms,' ms')}</b></div>
      <div class="row">p95 latency<b>${f(x.p95_latency_ms,' ms')}</b></div>
      <div class="row">p99 latency<b>${f(x.p99_latency_ms,' ms')}</b></div>
      <div class="row">Availability<b>${f(x.availability,'%')}</b></div></div>`}).join("");
    document.getElementById("inc").innerHTML=i.length?
      `<table><tr><th>Service</th><th>Rule</th><th>Severity</th><th>Peak</th><th>Status</th></tr>`+
      i.map(x=>`<tr><td>${x.service}</td><td>${x.metric} ${x.operator} ${x.threshold}</td><td>${x.severity}</td><td>${x.peak_value}</td><td>${x.resolved_at?'Resolved':'Open'}</td></tr>`).join("")+`</table>`
      :`<div class="empty">No incidents.</div>`;
  }catch(e){document.getElementById("sub").textContent="Could not load data.";}
}
load();setInterval(load,10000);
</script></body></html>
